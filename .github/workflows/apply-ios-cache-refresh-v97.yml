name: Atualizar PWA iOS para cache v97

on:
  push:
    paths:
      - '.github/workflows/apply-ios-cache-refresh-v97.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar atualização forçada do PWA iOS
        run: python scripts/apply_ios_cache_refresh_v97.py
      - name: Validar JavaScript
        run: |
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); a=re.findall(r'<script>(.*?)</script>',s,re.S); Path('/tmp/app.js').write_text(a[-1],encoding='utf-8')"
          node --check /tmp/app.js
      - name: Publicar alteração
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'fix: forçar atualização do PWA no iOS'
          git push
