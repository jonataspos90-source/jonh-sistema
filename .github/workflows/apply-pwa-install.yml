name: Aplicar PWA John Sistemas

on:
  push:
    paths:
      - '.github/workflows/apply-pwa-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar PWA
        run: python scripts/apply_pwa_install.py
      - name: Validar JavaScript embutido
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Publicar
        run: |
          if git diff --quiet; then
            echo 'Sem alterações.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: instalar John Sistemas como PWA'
          git push
