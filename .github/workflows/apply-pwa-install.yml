name: Aplicar PWA John Sistemas

on:
  push:
    paths:
      - '.github/workflows/apply-pwa-install.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar PWA
        run: python scripts/apply_pwa_install.py
      - name: Validar arquivos PWA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          html=Path('index.html').read_text(encoding='utf-8')
          json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          assert 'manifest.webmanifest' in html
          assert 'installAppBtn' in html
          assert 'navigator.serviceWorker.register' in html
          assert 'icons/john-sistemas-512.svg' in html
          assert Path('sw.js').exists()
          assert Path('icons/john-sistemas-192.svg').exists()
          assert Path('icons/john-sistemas-512.svg').exists()
          print('PWA validado com sucesso')
          PY
      - name: Publicar
        run: |
          if git diff --quiet; then
            echo 'Sem alterações.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: instalar John Sistemas como PWA'
          git push
