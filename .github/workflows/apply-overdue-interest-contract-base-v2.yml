name: Aplicar regra exata de juros de atraso

on:
  push:
    paths:
      - 'scripts/apply_overdue_interest_contract_base_v2.py'
      - '.github/workflows/apply-overdue-interest-contract-base-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar regra de juros sobre os juros contratuais
        run: python scripts/apply_overdue_interest_contract_base_v2.py
      - name: Validar JavaScript
        run: |
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); a=re.findall(r'<script>(.*?)</script>',s,re.S); Path('/tmp/app.js').write_text(a[-1],encoding='utf-8')"
          node --check /tmp/app.js
      - name: Validar exemplo de negócio
        run: |
          python - <<'PY'
          principal=100
          juros=40
          dias=21
          atraso=(juros/30)*dias
          total=principal+juros+atraso
          assert round(atraso,2)==28.00
          assert round(total,2)==168.00
          print('OK: 100 + 40 + (40/30*21) = 168')
          PY
      - name: Publicar alteração
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'fix: aplicar atraso sobre os juros originais do contrato'
          git push
