name: Aplicar pagamento parcial v3

on:
  push:
    paths:
      - '.github/workflows/apply-partial-payment-renewal-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir estrutura e aprimorar cobrança parcial
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # 1) Corrige um bloco iOS que havia sido inserido por engano dentro
          # do HTML de impressão do contrato. Isso quebrava o JavaScript principal.
          misplaced = re.compile(
              r"\n<script>\nfunction johnIsIOS\(\)\{.*?</script>\n\n(?=</body>\n</html>`;)",
              re.S
          )
          s, removed = misplaced.subn('\n', s, count=1)

          ios_js = r'''
          <script>
          function johnIsIOS(){
            return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
          }
          function johnIsStandalone(){
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
          }
          function johnIsIOSSafari(){
            const ua=navigator.userAgent;
            return johnIsIOS() && /Safari/i.test(ua) && !/(CriOS|FxiOS|EdgiOS|OPiOS|DuckDuckGo)/i.test(ua);
          }
          function showIOSInstallGuide(){
            if(johnIsStandalone()){
              toast('O John Sistemas já está adicionado à tela inicial.');
              return;
            }
            if(!johnIsIOSSafari()){
              modal(`
                <div class="modal-header"><h3>Instalar no iPhone / iPad</h3><button class="btn btn-outline btn-sm" onclick="closeModal()">Fechar</button></div>
                <div class="notice"><b>Abra este endereço no Safari.</b> O iOS só oferece “Adicionar à Tela de Início” pelo menu de compartilhamento do Safari.</div>
                <div class="ios-steps">
                  <div class="ios-step"><b>1</b><div>Copie ou abra o endereço do John Sistemas no <strong>Safari</strong>.</div></div>
                  <div class="ios-step"><b>2</b><div>No Safari, toque em <strong>Compartilhar</strong> (quadrado com seta para cima).</div></div>
                  <div class="ios-step"><b>3</b><div>Escolha <strong>Adicionar à Tela de Início</strong> e depois <strong>Adicionar</strong>.</div></div>
                </div>`);
              return;
            }
            modal(`
              <div class="modal-header"><h3> Adicionar John Sistemas</h3><button class="btn btn-outline btn-sm" onclick="closeModal()">Fechar</button></div>
              <div class="notice">No iPhone/iPad a instalação é feita pelo menu do Safari.</div>
              <div class="ios-steps">
                <div class="ios-step"><b>1</b><div>Toque no botão <strong>Compartilhar</strong> do Safari — o quadrado com uma seta para cima.</div></div>
                <div class="ios-step"><b>2</b><div>Role as opções e toque em <strong>Adicionar à Tela de Início</strong>.</div></div>
                <div class="ios-step"><b>3</b><div>Confirme o nome <strong>John Sistemas</strong> e toque em <strong>Adicionar</strong>.</div></div>
                <div class="ios-step"><b>4</b><div>O ícone aparecerá na tela do iPhone/iPad. Depois, basta tocar nele para abrir o sistema como app.</div></div>
              </div>`);
          }
          window.addEventListener('DOMContentLoaded',()=>{
            if(johnIsIOS() && !johnIsStandalone()){
              const btn=document.getElementById('iosInstallBtn');
              if(btn) btn.classList.remove('hidden');
            }
          });
          if('serviceWorker' in navigator){
            window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
          }
          </script>
          '''

          # Recoloca o suporte iOS no final real do documento, fora do template do contrato.
          if 'function johnIsIOS()' not in s:
              pos = s.rfind('\n</body>')
              if pos < 0:
                  raise SystemExit('Falha: fechamento real do body não encontrado')
              s = s[:pos] + '\n' + ios_js.strip() + '\n' + s[pos:]

          # 2) Versão da melhoria financeira.
          s = re.sub(r'<title>John Sistemas - Gestão de Empréstimos V\d+(?:\.\d+)?</title>',
                     '<title>John Sistemas - Gestão de Empréstimos V9.6</title>', s, count=1)
          s = re.sub(r"const APP_VERSION = '\d+(?:\.\d+)?';",
                     "const APP_VERSION = '9.6';", s, count=1)
          s = s.replace('Gestão de Empréstimos • V9.5','Gestão de Empréstimos • V9.6')

          # Identificação do ciclo atual. O contrato original é o ciclo 1.
          if 'function currentCycleNumber(l)' not in s:
              anchor = "function loanBalance(l){"
              helper = """function currentCycleNumber(l){
            const renewals=Array.isArray(l?.renewals)?l.renewals:[];
            return renewals.length+1;
          }
          function loanBalance(l){"""
              if anchor not in s:
                  raise SystemExit('Falha: função loanBalance não encontrada')
              s = s.replace(anchor, helper, 1)

          pattern = r"function openPaymentModal\(loanId=''\)\{.*?\nfunction renderPayments\(\)\{"
          replacement = r'''function openPaymentModal(loanId=''){
            const openLoans=state.loans.filter(l=>loanBalance(l)>0&&!['Cancelado','Renegociado','Excluído'].includes(l.status));
            if(!openLoans.length)return toast('Não há contratos com saldo a receber.');
            const opts=openLoans.map(l=>{
              const c=state.clients.find(x=>x.id===l.clientId);
              return `<option value="${l.id}" ${loanId===l.id?'selected':''}>#${l.contractNo} - ${safe(c?.name||'-')} - saldo ${brl(loanBalance(l))}</option>`;
            }).join('');
            modal(`
            <div class="modal-header"><h3>Registrar pagamento</h3><button class="btn btn-outline btn-sm" onclick="closeModal()">Fechar</button></div>
            <div class="notice"><b>Regra de pagamento parcial:</b> o saldo que não for pago vira a base do próximo ciclo e recebe novamente a mesma taxa percentual do contrato. Ex.: R$ 140,00 − R$ 40,00 = R$ 100,00; com 40%, o próximo saldo será R$ 140,00.</div>
            <div class="form-grid">
              <div class="field full"><label>Contrato *</label><select id="pLoan" onchange="fillPaymentValue()">${opts}</select></div>
              <div class="field"><label>Data</label><input id="pDate" type="date" value="${todayISO()}"></div>
              <div class="field"><label>Valor recebido *</label><input id="pValue" type="number" min="0.01" step="0.01" oninput="updatePaymentPreview()"></div>
              <div class="field"><label>Forma</label><select id="pMethod"><option>PIX</option><option>Dinheiro</option><option>Transferência</option><option>Cartão</option></select></div>
              <div class="field"><label>Multa/encargo dentro do valor</label><input id="pFee" type="number" min="0" step="0.01" value="0"></div>
              <div class="field full"><label>Observação</label><input id="pNotes"></div>
            </div>
            <div id="paymentRulePreview" class="notice"></div>
            <button id="savePaymentBtn" class="btn btn-success" onclick="savePayment()">Registrar recebimento</button>`);
            fillPaymentValue();
          }
          function fillPaymentValue(){
            const id=document.getElementById('pLoan')?.value;
            const l=state.loans.find(x=>x.id===id);
            if(l)document.getElementById('pValue').value=loanBalance(l).toFixed(2);
            updatePaymentPreview();
          }
          function updatePaymentPreview(){
            const id=document.getElementById('pLoan')?.value;
            const l=state.loans.find(x=>x.id===id);
            const box=document.getElementById('paymentRulePreview');
            if(!l||!box)return;
            const bal=loanBalance(l);
            const value=Number(document.getElementById('pValue')?.value||0);
            const cycle=currentCycleNumber(l);
            if(value<=0){
              box.innerHTML=`<b>Ciclo ${cycle}</b> · Saldo atual: <b>${brl(bal)}</b>. Informe o valor recebido para visualizar o cálculo.`;
              return;
            }
            if(value>bal+0.009){
              box.innerHTML=`<b style="color:var(--danger)">Valor acima do saldo.</b> O máximo permitido para este contrato é <b>${brl(bal)}</b>.`;
              return;
            }
            if(value>=bal-0.009){
              box.innerHTML=`<b>Ciclo ${cycle}</b> · Pagamento de <b>${brl(value)}</b> quita o saldo atual de <b>${brl(bal)}</b>. <b>Não haverá nova cobrança de juros.</b>`;
              return;
            }
            const remaining=Math.max(0,bal-value);
            const rate=Math.max(0,Number(l.interest||0));
            const newInterest=remaining*(rate/100);
            const newBalance=remaining+newInterest;
            box.innerHTML=`
              <b>Prévia da renovação · Ciclo ${cycle} → ${cycle+1}</b>
              <div style="margin-top:8px;display:grid;gap:4px">
                <div>Saldo atual: <b>${brl(bal)}</b></div>
                <div>Valor recebido: <b>${brl(value)}</b></div>
                <div>Saldo não pago / nova base: <b>${brl(remaining)}</b></div>
                <div>Taxa mantida: <b>${rate.toFixed(2).replace('.',',')}%</b></div>
                <div>Juros do novo ciclo: <b>${brl(newInterest)}</b></div>
                <div>Novo saldo a pagar: <b>${brl(newBalance)}</b></div>
              </div>`;
          }
          function savePayment(){
            const loanId=document.getElementById('pLoan')?.value;
            const l=state.loans.find(x=>x.id===loanId);
            if(!l)return toast('Contrato não encontrado.');
            const value=Number(document.getElementById('pValue')?.value||0);
            const bal=loanBalance(l);
            if(value<=0)return toast('Informe o valor recebido.');
            if(value>bal+0.009)return toast(`O pagamento não pode ser maior que o saldo atual (${brl(bal)}).`);

            const btn=document.getElementById('savePaymentBtn');
            if(btn?.disabled)return;
            if(btn)btn.disabled=true;

            try{
              const cycleBefore=currentCycleNumber(l);
              const cycle=currentCycleFinancials(l);
              const interestPart=Math.min(value,Math.max(0,cycle.interest));
              const principalPart=Math.max(0,Math.min(Math.max(0,cycle.base),value-interestPart));
              const p={
                id:uid('pay'),loanId,date:document.getElementById('pDate').value||todayISO(),value,
                method:document.getElementById('pMethod').value,fee:Number(document.getElementById('pFee').value||0),
                notes:document.getElementById('pNotes').value,principalPart,interestPart,balanceBefore:bal,
                cycleBefore,cycleAfter:cycleBefore
              };
              state.payments.push(p);

              let renewedBalance=null;
              if(value<bal-0.009){
                const remaining=Math.max(0,bal-value);
                const rate=Math.max(0,Number(l.interest||0));
                const interestAdded=remaining*(rate/100);
                renewedBalance=remaining+interestAdded;
                const renewalNo=(Array.isArray(l.renewals)?l.renewals.length:0)+1;
                const renewal={
                  id:uid('ren'),renewalNo,date:p.date,paymentId:p.id,previousBalance:bal,paymentValue:value,
                  baseAfterPayment:remaining,interestRate:rate,interestAdded,newBalance:renewedBalance,
                  cycleFrom:cycleBefore,cycleTo:cycleBefore+1,
                  paidTotal:loanPaid(l.id),createdAt:new Date().toISOString(),createdByUserId:getCurrentUser().id||''
                };
                l.renewals=Array.isArray(l.renewals)?l.renewals:[];
                l.renewals.push(renewal);
                p.renewalId=renewal.id;
                p.renewalNo=renewalNo;
                p.renewalInterest=interestAdded;
                p.renewedBalance=renewedBalance;
                p.cycleAfter=cycleBefore+1;
                addLoanOccurrence(l,'Pagamento parcial e renovação de saldo',null,null,`Ciclo ${cycleBefore} → ${cycleBefore+1}; saldo antes ${brl(bal)}; pagamento ${brl(value)}; base renovada ${brl(remaining)}; taxa ${rate.toFixed(2)}%; juros do novo ciclo ${brl(interestAdded)}; novo saldo ${brl(renewedBalance)}`);
              }else{
                addLoanOccurrence(l,'Pagamento e quitação do contrato',null,null,`Ciclo ${cycleBefore}; saldo antes ${brl(bal)}; pagamento ${brl(value)}; saldo final ${brl(0)}`);
              }

              audit('Pagamento recebido',`Contrato ${l.contractNo} - ${brl(value)} - ciclo ${cycleBefore}${renewedBalance!==null?' → '+(cycleBefore+1)+' - novo saldo '+brl(renewedBalance):' - quitado'}`);
              saveState();closeModal();renderAll();
              if(renewedBalance!==null) toast(`Pagamento parcial registrado. Ciclo ${cycleBefore+1} aberto com saldo de ${brl(renewedBalance)}.`);
              else toast(`Pagamento registrado. Contrato ${l.contractNo} quitado.`);
            }catch(err){
              console.error(err);
              if(btn)btn.disabled=false;
              toast('Não foi possível registrar o pagamento. Revise os dados antes de tentar novamente.');
            }
          }
          function renderPayments(){'''

          s, n = re.subn(pattern, lambda m: replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Falha: fluxo de pagamento encontrado {n} vez(es)')

          old_text = 'Saldo renovado: ${brl(p.renewedBalance)} (+${brl(p.renewalInterest)} de nova taxa)'
          new_text = 'Renovação ${p.renewalNo?(\'#\'+p.renewalNo+\' · \'):\'\'}saldo renovado: ${brl(p.renewedBalance)} (+${brl(p.renewalInterest)} de nova taxa)'
          if old_text in s:
              s = s.replace(old_text, new_text, 1)

          required = [
              "const APP_VERSION = '9.6';",
              'function currentCycleNumber(l)',
              'id="savePaymentBtn"',
              'O pagamento não pode ser maior que o saldo atual',
              'cycleBefore,cycleAfter:cycleBefore',
              "addLoanOccurrence(l,'Pagamento parcial e renovação de saldo'",
              'function johnIsIOS()'
          ]
          missing = [item for item in required if item not in s]
          if missing:
              raise SystemExit('Falha de validação: ' + ' | '.join(missing))

          # Garante que o suporte iOS não permaneça dentro do HTML de impressão.
          print_start = s.find('function contractPrintHTML(id)')
          print_end = s.find('function printContract(id)', print_start)
          if print_start >= 0 and print_end > print_start and 'function johnIsIOS()' in s[print_start:print_end]:
              raise SystemExit('Falha: suporte iOS ainda está dentro do template do contrato')

          path.write_text(s, encoding='utf-8')
          print(f'Cobrança parcial v3 aplicada; bloco iOS deslocado: {removed}.')
          PY

      - name: Extrair e validar JavaScript principal
        run: |
          python <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('<script>\nconst STORAGE_KEY')+len('<script>')
          separator='\n</script>\n\n<script>\nfunction johnIsIOS'
          end=s.rfind(separator)
          if end < start:
              raise SystemExit('Não foi possível separar o JavaScript principal')
          Path('/tmp/main-app.js').write_text(s[start:end],encoding='utf-8')
          ios_start=s.rfind('<script>\nfunction johnIsIOS')+len('<script>')
          ios_end=s.find('</script>',ios_start)
          if ios_start < len('<script>') or ios_end < ios_start:
              raise SystemExit('Não foi possível separar o JavaScript iOS')
          Path('/tmp/ios-app.js').write_text(s[ios_start:ios_end],encoding='utf-8')
          PY
          node --check /tmp/main-app.js
          node --check /tmp/ios-app.js

      - name: Testar regra financeira principal
        run: |
          node <<'NODE'
          const renewal=(saldo,pagamento,taxa)=>{
            if(pagamento>saldo) throw new Error('pagamento maior que saldo');
            const base=Math.max(0,saldo-pagamento);
            const juros=base*(taxa/100);
            return {base,juros,novoSaldo:base+juros};
          };
          const a=renewal(140,40,40);
          if(a.base!==100 || a.juros!==40 || a.novoSaldo!==140) process.exit(1);
          const b=renewal(140,70,40);
          if(b.base!==70 || b.juros!==28 || b.novoSaldo!==98) process.exit(1);
          const c=renewal(98,28,40);
          if(c.base!==70 || c.juros!==28 || c.novoSaldo!==98) process.exit(1);
          let blocked=false;
          try{renewal(98,99,40)}catch(e){blocked=true}
          if(!blocked) process.exit(1);
          console.log('Testes financeiros OK');
          NODE

      - name: Publicar melhoria
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: aprimorar cobrança parcial por ciclos'
          git push
