services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: john_sistemas
      POSTGRES_USER: john
      POSTGRES_PASSWORD: john_local_dev
    ports:
      - '5432:5432'
    volumes:
      - john_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U john -d john_sistemas']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  john_pgdata:
